name: Profile metrics

on:
  # Refresh every day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate when this workflow changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN covers public data out of the box.
          # For private-repo contributions, create a classic PAT
          # (scopes: repo, read:user) and store it as the
          # METRICS_TOKEN secret — it is used automatically when set.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Joehoel
          filename: github-metrics.svg
          config_timezone: Europe/Amsterdam

          # --- look & content ---
          template: classic
          base: header, activity, community, repositories, metadata

          # Top languages used across repos
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # Full-year contribution calendar (isometric)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits / time-of-day charts
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
