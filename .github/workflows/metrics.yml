name: Profile metrics

on:
  # Refresh every day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate when this workflow changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN covers public data out of the box.
          # For private-repo contributions, create a classic PAT
          # (scopes: repo, read:user) and store it as the
          # METRICS_TOKEN secret — it is used automatically when set.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Joehoel
          filename: github-metrics.svg
          config_timezone: Europe/Amsterdam

          # --- look & content ---
          # Strip everything: no name/header, no activity, community,
          # repositories or metadata sections.
          template: classic
          base: ""

          # Only the habits *facts* — this is where "Commits streaks"
          # (current + best) and "Commits per day" live.
          # Charts are disabled (the "Recent coding habits" graphs).
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_from: 200
